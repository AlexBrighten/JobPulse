<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobPulse — Application & Resume Performance Tracker</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon16.png">
  <meta http-equiv="refresh" content="0; url=/dashboard/dashboard.html">
  <script>
    // Preserve query parameters and hashes when redirecting
    const targetUrl = "/dashboard/dashboard.html" + window.location.search + window.location.hash;
    window.location.replace(targetUrl);
  </script>
  <style>
    body {
      margin: 0;
      background: #0a0a0c;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 13px;
      color: #a1a1aa;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div class="loading-text">Loading JobPulse Dashboard...</div>
  </div>
</body>
</html>
